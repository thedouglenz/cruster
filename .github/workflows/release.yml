name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: ${{ matrix.target }}

      - name: Build release binary
        working-directory: app
        run: cargo build --release --target ${{ matrix.target }} -p cruster-bin

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage artifact
        run: |
          set -euxo pipefail
          stage="cruster-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp app/target/${{ matrix.target }}/release/cruster "$stage/cruster"
          cp README.md "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          tar czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cruster-${{ matrix.target }}
          path: |
            cruster-*.tar.gz
            cruster-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List
        run: ls -lh dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="Cruster v${version} — see CHANGELOG.md (if present) for details. SHA256s are in the .sha256 sidecar files."
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "cruster v${version}" \
            --notes "$notes" \
            dist/cruster-*.tar.gz \
            dist/cruster-*.tar.gz.sha256
