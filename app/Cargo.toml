[workspace]
resolver = "2"
members = [
    "crates/cruster-core",
    "crates/cruster-kube",
    "crates/cruster-tui",
    "crates/cruster-cli",
    "crates/cruster-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license-file = "../LICENSE"
authors = ["Doug Lenz <thedouglenz@gmail.com>"]
repository = "https://github.com/thedouglenz/cruster"
homepage = "https://github.com/thedouglenz/cruster"
description = "Kubernetes TUI + CLI with agent-friendly diagnostics. A paid k9s competitor optimised for speed, ergonomics, and Claude Code compatibility."
keywords = ["kubernetes", "k8s", "tui", "kubectl", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }
is-terminal = "0.4"

# TUI extras
nucleo-matcher = "0.3"
arboard = "3"
toml = "0.8"
dirs = "5"
tera = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Kube
kube = { version = "0.95", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# Workspace crates
cruster-core = { path = "crates/cruster-core" }
cruster-kube = { path = "crates/cruster-kube" }
cruster-tui = { path = "crates/cruster-tui" }
cruster-cli = { path = "crates/cruster-cli" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
